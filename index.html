<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="積読">
<meta name="theme-color" content="#111111">
<title>マイYouTube</title>
<style>
  :root { --bg:#111; --fg:#eee; --sub:#999; --card:#1c1c1c; --accent:#e8b04b; }
  * { box-sizing:border-box; }
  body {
    margin:0; background:var(--bg); color:var(--fg);
    font-family:-apple-system, "Hiragino Sans", sans-serif;
    padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
  }
  header { padding:16px 16px 8px; }
  h1 { margin:0; font-size:20px; }
  p.sub { margin:4px 0 0; color:var(--sub); font-size:13px; }
  nav { display:flex; gap:8px; padding:8px 16px; overflow-x:auto; }
  nav button {
    flex:none; border:1px solid #333; background:var(--card); color:var(--fg);
    padding:8px 14px; border-radius:999px; font-size:14px;
  }
  nav button.active { border-color:var(--accent); color:var(--accent); }
  .player { position:relative; width:100%; aspect-ratio:16/9; background:#000; }
  .player iframe { position:absolute; inset:0; width:100%; height:100%; border:0; }
  .hint { padding:12px 16px; color:var(--sub); font-size:12px; line-height:1.6; }
</style>
</head>
<body>
<header>
  <h1 id="title">積読チャンネル</h1>
  <p class="sub">新しい動画から順に再生します。プレーヤー右上のリストから動画を選べます。</p>
</header>

<!-- チャンネルが2つ以上になると、ここに切り替えボタンが並びます -->
<nav id="tabs"></nav>

<div class="player">
  <iframe id="player" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen></iframe>
</div>

<script>
  // 見てもいいチャンネルの一覧。id は youtube.com/channel/UC... の「UC...」の部分
  const CHANNELS = [
    { name: "積読チャンネル", id: "UCuG0Ay4D67uecldB_G9Ymeg" },
    { name: "Sifu", id: "UCrm0e3hIB8AktJiV_H0WfNA" },
  ];

  // チャンネルIDの先頭 UC を UU にすると「アップロード動画」のプレイリストIDになる
  const uploadsId = (channelId) => "UU" + channelId.slice(2);

  function play(i) {
    const ch = CHANNELS[i];
    const params = new URLSearchParams({
      list: uploadsId(ch.id),
      rel: "0",            // 関連動画を同じチャンネルの動画に限る
      playsinline: "1",
      modestbranding: "1",
    });
    document.getElementById("player").src =
      "https://www.youtube-nocookie.com/embed/videoseries?" + params;
    document.getElementById("title").textContent = ch.name;
    document.querySelectorAll("#tabs button").forEach((b, j) =>
      b.classList.toggle("active", i === j));
  }

  const tabs = document.getElementById("tabs");
  if (CHANNELS.length > 1) {
    CHANNELS.forEach((ch, i) => {
      const b = document.createElement("button");
      b.textContent = ch.name;
      b.onclick = () => play(i);
      tabs.appendChild(b);
    });
  } else {
    tabs.style.display = "none";
  }
  play(0);
</script>
</body>
</html>
