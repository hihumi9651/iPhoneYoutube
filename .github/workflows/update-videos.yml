name: 動画一覧を更新

on:
  schedule:
    - cron: "17 20 * * *"   # 毎日 5:17（日本時間）
  workflow_dispatch:        # Actions 画面から手動実行もできる
  push:
    paths:
      - channels.json       # チャンネルを追加したらすぐ更新

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 動画一覧を取得
        env:
          YT_API_KEY: ${{ secrets.YT_API_KEY }}
        run: python scripts/fetch_videos.py
      - name: 変更があればコミット
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add videos.json
          git diff --cached --quiet || (git commit -m "動画一覧を更新" && git push)
